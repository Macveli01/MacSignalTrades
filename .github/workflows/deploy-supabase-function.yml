name: Deploy MacSignalTrades Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/macsignaltrades-scanner/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: reoyfmavtaldilcawwzp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub repository secrets."
            exit 1
          fi
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy scanner function
        run: supabase functions deploy macsignaltrades-scanner --project-ref "$PROJECT_ID" --yes
