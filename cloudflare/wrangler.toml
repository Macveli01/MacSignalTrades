name = "macsignaltrades-scanner"
main = "src/index.ts"
compatibility_date = "2026-11-06"
workers_dev = true

[triggers]
crons = ["*/2 6-17 * * *"]

[observability]
enabled = true
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
